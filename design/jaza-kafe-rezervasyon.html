<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Jaza — Kafe Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#25120C; --surface-1:#331C13; --surface-2:#3E2417;
    --border:rgba(232,201,163,0.13); --border-strong:rgba(232,201,163,0.26);
    --copper-400:#D88A54; --copper-500:#C97B4A; --amber-glow:#E8A868;
    --cream:#F3E9DC; --taupe:#B7A491; --taupe-dim:#93816E;
    --success:#8FAE7D; --live:#D8724A; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:#150A06; font-family:'Inter',sans-serif; padding:48px 20px; }
  .stage{ max-width:380px; margin:0 auto; }
  .phone{
    position:relative; background:var(--bg); border-radius:40px; border:8px solid #0B0704;
    padding:0 0 28px; box-shadow:0 40px 80px rgba(0,0,0,0.55); overflow:hidden; min-height:600px;
  }
  .status-bar{ font-family:var(--mono); display:flex; justify-content:space-between; font-size:11px; color:var(--taupe); padding:14px 22px 10px; position:relative; z-index:2; }

  .hero{ position:relative; height:170px; overflow:hidden; }
  .hero img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hero::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(37,18,12,0) 40%, rgba(37,18,12,0.95) 100%);
  }
  .back-btn{
    position:absolute; top:14px; left:16px; width:32px; height:32px; border-radius:50%;
    background:rgba(21,10,6,0.55); backdrop-filter:blur(6px); display:flex; align-items:center;
    justify-content:center; z-index:2; border:0.5px solid rgba(243,233,220,0.18); text-decoration:none;
  }
  .hero-text{ position:absolute; left:20px; right:20px; bottom:14px; z-index:2; }
  .hero-title{ font-family:'Fraunces',serif; font-style:italic; font-size:26px; color:var(--cream); margin:0 0 3px; }
  .hero-sub{ font-family:var(--mono); font-size:11px; color:var(--taupe); letter-spacing:0.02em; }

  .content{ padding:20px 20px 0; }

  .occ-card{
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 45%), var(--surface-1);
    border:0.5px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; text-align:center;
  }
  .occ-live{ display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px; }
  @keyframes pulseDot{ 0%,100%{ box-shadow:0 0 0 0 rgba(216,114,74,0.55);} 50%{ box-shadow:0 0 0 5px rgba(216,114,74,0);} }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--live); animation:pulseDot 2.2s ease-in-out infinite; }
  .occ-live span{ font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--taupe-dim); }
  .occ-count{ font-family:var(--mono); font-weight:500; font-size:40px; color:var(--amber-glow); text-shadow:0 0 18px rgba(232,168,104,0.35); line-height:1; }
  .occ-cap{ font-family:var(--mono); font-size:13px; color:var(--taupe); margin:2px 0 16px; }
  .occ-bar{ height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-bottom:10px; }
  .occ-bar-fill{ height:100%; border-radius:4px; background:linear-gradient(90deg, var(--copper-400), var(--amber-glow)); transition:width .4s ease, background .3s ease; }
  .occ-status{ font-size:12.5px; color:var(--cream); }

  .demo-ctrl{
    display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:24px;
    font-family:var(--mono); font-size:10px; color:var(--taupe-dim);
  }
  .demo-ctrl button{
    width:24px; height:24px; border-radius:50%; border:0.5px solid var(--border-strong); background:transparent;
    color:var(--taupe); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;
  }

  .qr-btn{
    display:block; width:100%; font-family:'Inter',sans-serif; font-size:14px; font-weight:500; color:#231409;
    background:var(--copper-500); border:none; border-radius:100px; padding:16px 0; cursor:pointer; text-align:center;
    transition:transform .15s ease, background .3s ease, opacity .3s ease;
  }
  .qr-btn:active{ transform:scale(0.97); }
  .qr-btn.full{ background:var(--surface-2); color:var(--taupe-dim); cursor:not-allowed; }
  .qr-hint2{ text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--taupe-dim); margin:10px 0 0; }

  .success-panel{ display:none; text-align:center; padding:28px 20px 30px; }
  .success-panel.show{ display:block; animation:detailIn .45s cubic-bezier(.16,1,.3,1) both; }
  @keyframes detailIn{ from{ opacity:0; transform:translateY(10px) scale(.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .success-check{
    width:44px; height:44px; border-radius:50%; margin:4px auto 14px; background:rgba(143,174,125,0.16);
    display:flex; align-items:center; justify-content:center;
  }
  .success-title{ font-family:'Fraunces',serif; font-style:italic; font-size:20px; color:var(--cream); margin:0 0 4px; }
  .success-sub{ font-size:12.5px; color:var(--taupe); margin:0 0 20px; }
  .qr-box{
    width:168px; height:168px; margin:0 auto 16px; background:#F3E9DC; border-radius:14px;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  .qr-box canvas, .qr-box img{ width:100% !important; height:100% !important; }
  .qr-hint{ font-family:var(--mono); font-size:10.5px; color:var(--taupe-dim); letter-spacing:0.04em; margin:0 0 22px; }
  .qr-summary{
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 45%), var(--surface-1);
    border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; text-align:left; margin-bottom:20px;
  }
  .qr-row{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:12px; padding:4px 0; }
  .qr-row span:first-child{ color:var(--taupe-dim); }
  .qr-row span:last-child{ color:var(--cream); }
  .close-btn{
    width:100%; font-family:'Inter',sans-serif; font-size:13px; color:var(--taupe); background:transparent;
    border:0.5px solid var(--border-strong); border-radius:100px; padding:13px 0; cursor:pointer;
  }
</style>
</head>

      <p class="hero-sub">Anlık giriş · QR ile kapıdan geçin</p>
    </div>
  </div>

  <div class="content" id="mainView">
    <div class="occ-card">
      <div class="occ-live"><span class="live-dot"></span><span>Canlı doluluk</span></div>
      <div class="occ-count" id="occCount">9</div>
      <div class="occ-cap" id="occCap">/ 14 kişi</div>
      <div class="occ-bar"><div class="occ-bar-fill" id="occBarFill"></div></div>
      <div class="occ-status" id="occStatus"></div>
    </div>

    <div class="demo-ctrl">
      <span>Demo: kişi sayısını değiştir</span>
      <button onclick="stepOcc(-1)" aria-label="Azalt">–</button>
      <button onclick="stepOcc(1)" aria-label="Artır">+</button>
    </div>

    <button class="qr-btn" id="qrBtn" onclick="getQR()">QR kodumu al</button>
    <p class="qr-hint2" id="qrHint2">Kapıdaki okutucuya göstererek girin</p>
  </div>

  <div class="success-panel" id="successPanel">
    <div class="success-check">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <p class="success-title">Giriş kodunuz hazır</p>
    <p class="success-sub">Bu QR kodu kapıdaki okutucuya gösterin</p>
    <div class="qr-box" id="qrBox"></div>
    <p class="qr-hint" id="qrRef">JAZA-CF-000000</p>
    <div class="qr-summary" id="qrSummary"></div>
    <button class="close-btn" onclick="closeSuccess()">Kapat</button>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  var capacity = 14;
  var occupied = 9;
  var checkedIn = false;

  function fmtClock(){
    var d = new Date();
    var h = d.getHours(); var m = d.getMinutes();
    return (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
  }
  document.getElementById('clock').textContent = fmtClock();

  function renderOcc(){
    document.getElementById('occCount').textContent = occupied;
    document.getElementById('occCap').textContent = '/ ' + capacity + ' kişi';
    var pct = Math.min(100, Math.round((occupied/capacity)*100));
    var fill = document.getElementById('occBarFill');
    fill.style.width = pct + '%';

    var btn = document.getElementById('qrBtn');
    var status = document.getElementById('occStatus');
    var isFull = occupied >= capacity;

    if (isFull){
      fill.style.background = 'var(--live)';
      status.textContent = 'Şu an dolu';
      status.style.color = 'var(--live)';
      btn.classList.add('full');
      btn.textContent = 'Şu an dolu';
      btn.disabled = true;
    } else {
      fill.style.background = 'linear-gradient(90deg, var(--copper-400), var(--amber-glow))';
      status.textContent = (capacity - occupied) + ' kişilik yer var';
      status.style.color = 'var(--success)';
      btn.classList.remove('full');
      btn.textContent = checkedIn ? 'QR kodumu tekrar göster' : 'QR kodumu al';
      btn.disabled = false;
    }
  }

  function stepOcc(d){
    occupied = Math.max(0, Math.min(capacity, occupied + d));
    renderOcc();
  }

  var currentRef = null;
  function getQR(){
    if (occupied >= capacity && !checkedIn) return;
    if (!checkedIn){
      occupied = Math.min(capacity, occupied + 1);
      checkedIn = true;
      currentRef = 'JAZA-CF-' + Math.random().toString(36).slice(2,7).toUpperCase();
      renderOcc();
    }
    document.getElementById('mainView').style.display = 'none';
    var panel = document.getElementById('successPanel');
    panel.classList.remove('show'); void panel.offsetWidth; panel.classList.add('show');

    document.getElementById('qrRef').textContent = currentRef;
    document.getElementById('qrBox').innerHTML = '';
    new QRCode(document.getElementById('qrBox'), {
      text: 'https://jaza.app/checkin/' + currentRef, width: 144, height: 144,
      colorDark: '#25120C', colorLight: '#F3E9DC', correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById('qrSummary').innerHTML =
      '<div class="qr-row"><span>Mekan</span><span>Jaza Cafe</span></div>' +
      '<div class="qr-row"><span>Giriş saati</span><span>' + fmtClock() + '</span></div>' +
      '<div class="qr-row"><span>Kişi</span><span>1</span></div>';
  }

  function closeSuccess(){
    document.getElementById('successPanel').classList.remove('show');
    document.getElementById('mainView').style.display = 'block';
    renderOcc();
  }

  renderOcc();
</script>
</body>
</html>
